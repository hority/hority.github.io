<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#071316">
  <title>九伊万里絵のIXシュート - IX-Party 3D Shooting</title>
  <meta name="description" content="IX-Partyと九伊万里絵をテーマにした、スマホ縦持ち片手操作の3Dシューティングゲーム。">
  <meta property="og:title" content="九伊万里絵のIXシュート">
  <meta property="og:description" content="九伊万里絵を操作して、伊万里焼風ターゲットを撃ち落とす3Dシューティング。9連撃でRush。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hority.github.io/ix9-nine-shooter/">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <main id="app" aria-label="九伊万里絵のIXシュート">
    <canvas id="gameCanvas"></canvas>

    <div id="hud" aria-live="polite">
      <section class="hud-chip objective" aria-label="Objective">
        <span class="chip-mark">IX</span>
        <span>
          <strong>IXシュート</strong>
          <small>9連撃でRush</small>
        </span>
      </section>

      <section class="hud-chip status" aria-label="Status">
        <span><b data-ui="score">0</b><small>score</small></span>
        <span><b data-ui="best">0</b><small>best</small></span>
        <span><b data-ui="hp">9</b><small>hp</small></span>
      </section>

      <section class="combo-strip" aria-label="Combo meter">
        <div class="combo-label">
          <span>9 Chain</span>
          <b><span data-ui="combo">0</span>/9</b>
        </div>
        <div class="meter"><span data-ui="comboFill"></span></div>
      </section>

      <div class="toast" data-ui="message">照準を動かして自動連射</div>
    </div>

    <section id="startOverlay" class="overlay">
      <div class="overlay-inner">
        <p class="eyebrow">IX-Party 3D</p>
        <h1>九伊万里絵の<br>IXシュート</h1>
        <p class="lead">横へなぞって照準移動。九伊万里絵がIXビームを自動連射します。</p>
        <button id="startButton" type="button">Start</button>
        <p class="thumb-hint">片手で押したまま横へ</p>
      </div>
    </section>

    <section id="gameOverOverlay" class="overlay" hidden>
      <div class="overlay-inner">
        <p class="eyebrow">Mission Finished</p>
        <h2>Score <span data-ui="finalScore">0</span></h2>
        <p class="lead">Best <span data-ui="finalBest">0</span></p>
        <button id="restartButton" type="button">Retry</button>
      </div>
    </section>

    <div id="landscapeHint">スマホを縦向きにすると照準操作がしやすくなります</div>
    <noscript>JavaScriptを有効にして遊んでください。</noscript>
  </main>

  <script type="module" src="./src/game.js"></script>
</body>
</html>
