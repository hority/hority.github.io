<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#071316">
  <title>IXプレートタワー - IX-Party 3D Stack</title>
  <meta name="description" content="IX-Partyをテーマにした、スマホ縦持ちワンタップ操作の3D積み上げゲーム。">
  <meta property="og:title" content="IXプレートタワー">
  <meta property="og:description" content="伊万里焼風のIXプレートをタイミングよく積む3Dスタックゲーム。9段ごとにRush。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hority.github.io/ix9-plate-stack/">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <main id="app" aria-label="IXプレートタワー">
    <canvas id="gameCanvas"></canvas>

    <div id="hud" aria-live="polite">
      <section class="hud-chip objective" aria-label="Objective">
        <span class="chip-mark">IX</span>
        <span>
          <strong>プレートタワー</strong>
          <small>9段でRush</small>
        </span>
      </section>

      <section class="hud-chip status" aria-label="Status">
        <span><b data-ui="score">0</b><small>score</small></span>
        <span><b data-ui="best">0</b><small>best</small></span>
        <span><b data-ui="floor">0</b><small>floor</small></span>
      </section>

      <section class="combo-strip" aria-label="Rush meter">
        <div class="combo-label">
          <span>9 Stack</span>
          <b><span data-ui="combo">0</span>/9</b>
        </div>
        <div class="meter"><span data-ui="comboFill"></span></div>
      </section>

      <div class="toast" data-ui="message">タップで積む</div>
    </div>

    <section id="startOverlay" class="overlay">
      <div class="overlay-inner">
        <p class="eyebrow">IX-Party 3D</p>
        <h1>IXプレート<br>タワー</h1>
        <p class="lead">左右に動く伊万里焼風プレートを、タイミングよくタップして積み上げます。</p>
        <button id="startButton" type="button">Start</button>
        <p class="thumb-hint">画面のどこでもタップ</p>
      </div>
    </section>

    <section id="gameOverOverlay" class="overlay" hidden>
      <div class="overlay-inner">
        <p class="eyebrow">Tower Finished</p>
        <h2>Score <span data-ui="finalScore">0</span></h2>
        <p class="lead">Best <span data-ui="finalBest">0</span></p>
        <button id="restartButton" type="button">Retry</button>
      </div>
    </section>

    <div id="landscapeHint">スマホを縦向きにすると積みやすくなります</div>
    <noscript>JavaScriptを有効にして遊んでください。</noscript>
  </main>

  <script type="module" src="./src/game.js"></script>
</body>
</html>
