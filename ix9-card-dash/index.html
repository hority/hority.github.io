<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#071316">
  <title>九伊万里絵の名刺ダッシュ - IX-Party 3D Game</title>
  <meta name="description" content="IX-Partyをテーマにした、スマホ縦持ち片手操作の名刺配りよけゲーム。">
  <meta property="og:title" content="九伊万里絵の名刺ダッシュ">
  <meta property="og:description" content="参加者に名刺を配り、ケーブルや資料山をよける3Dスコアアタック。9枚配るとRush。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hority.github.io/ix9-card-dash/">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <main id="app" aria-label="九伊万里絵の名刺ダッシュ">
    <canvas id="gameCanvas"></canvas>

    <div id="hud" aria-live="polite">
      <section class="hud-chip objective" aria-label="Objective">
        <span class="chip-mark">IX</span>
        <span>
          <strong>名刺ダッシュ</strong>
          <small>9枚でRush</small>
        </span>
      </section>

      <section class="hud-chip status" aria-label="Status">
        <span><b data-ui="score">0</b><small>score</small></span>
        <span><b data-ui="best">0</b><small>best</small></span>
        <span><b data-ui="cards">9</b><small>cards</small></span>
      </section>

      <section class="combo-strip" aria-label="Rush meter">
        <div class="combo-label">
          <span>9 Cards</span>
          <b><span data-ui="combo">0</span>/9</b>
        </div>
        <div class="meter"><span data-ui="comboFill"></span></div>
      </section>

      <div class="toast" data-ui="message">名刺を配ろう</div>
    </div>

    <section id="startOverlay" class="overlay">
      <div class="overlay-inner">
        <p class="eyebrow">IX-Party 3D</p>
        <h1>九伊万里絵の<br>名刺ダッシュ</h1>
        <p class="lead">左右へドラッグして参加者に名刺を配り、ケーブルや資料山をよけます。</p>
        <button id="startButton" type="button">Start</button>
        <p class="thumb-hint">画面を押したまま横へ</p>
      </div>
    </section>

    <section id="gameOverOverlay" class="overlay" hidden>
      <div class="overlay-inner">
        <p class="eyebrow">Networking Finished</p>
        <h2>Score <span data-ui="finalScore">0</span></h2>
        <p class="lead">Best <span data-ui="finalBest">0</span></p>
        <button id="restartButton" type="button">Retry</button>
      </div>
    </section>

    <div id="landscapeHint">スマホを縦向きにすると名刺を配りやすくなります</div>
    <noscript>JavaScriptを有効にして遊んでください。</noscript>
  </main>

  <script type="module" src="./src/game.js"></script>
</body>
</html>
